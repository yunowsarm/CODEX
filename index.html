<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片/压缩包双格式生成器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>图片 + 压缩包 双格式文件生成器</h1>
      <section class="card">
        <div class="field file-field file-field--folder">
          <span class="field-label">1) 文件存储位置</span>
          <button type="button" id="chooseDirBtn" class="file-picker-btn-standalone">选择文件夹</button>
          <small id="saveDirMeta">未选择</small>
        </div>

        <div class="field file-field file-field--image">
          <span class="field-label">2) 选择图片文件（建议 JPG）</span>
          <label class="file-picker" for="imageInput">
            <input id="imageInput" type="file" accept="image/*" />
            <span class="file-picker-btn">选择图片</span>
          </label>
          <small id="imageMeta">未选择文件</small>
        </div>

        <div class="field file-field file-field--zip">
          <span class="field-label">3) 选择压缩包文件</span>
          <label class="file-picker" for="zipInput">
            <input id="zipInput" type="file" accept=".zip,application/zip" />
            <span class="file-picker-btn">选择压缩包文件</span>
          </label>
          <small id="zipMeta">未选择文件</small>
        </div>

        <div class="actions">
          <button id="buildBtn" disabled>生成</button>
          <button id="openFolderBtn" type="button" class="btn-reset" disabled>打开生成文件夹</button>
          <button id="resetBtn" type="button" class="btn-reset">重置</button>
        </div>
      </section>

      <section class="card preview-card hidden" id="previewCard">
        <h2>图片预览</h2>
        <img id="preview" alt="图片预览" />
      </section>
    </main>
    <div id="toastContainer" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
